<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Pulse · Panel</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'night';</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/orbitalpulse.css">

<script src="../js/vendor/react.production.min.js"></script>
<script src="../js/vendor/react-dom.production.min.js"></script>
<script src="../js/orbitalpulse.js"></script>
</head>
<body>
<div id="root" class="vt-stage"></div>
<script>
  var V = window.OrbitalPulse, h = React.createElement;

  var p = { margin: 0, font: '400 13px/18px var(--font-sans)', color: 'var(--ink-muted)' };
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(V.Panel, { title: 'Cabin air', meta: '09:12Z', scan: true, style: { width: 300 } },
      h('p', { style: p }, 'Corner brackets mark a live instrument. The scanline means the feed is streaming.')),
    h(V.Panel, { title: 'Notes', plain: true, style: { width: 300 } },
      h('p', { style: p }, 'Plain panels hold static content.'))
  ));
</script>
</body>
</html>
