<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHealth · Cover</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'night';</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/astrohealth.css">
<style>
  html, body { margin: 0; background: var(--void); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--void); }
  .cv svg { position: absolute; inset: 0; }
  .b-signal { fill: var(--signal); } .b-holo { fill: var(--holo); } .b-tint { fill: var(--line-strong); } .b-ink { fill: var(--ink); }
  .tile { rx: var(--radius-md); }
  .orb { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .orb-h { fill: none; stroke: var(--holo); stroke-width: 1.5; stroke-dasharray: 2 6; }
  .sat { fill: var(--signal); }
  .cv-txt { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .cv-name { margin: 0; font: 600 64px/.92 var(--font-display); letter-spacing: -.02em; color: var(--ink); }
  .cv-name i { font-style: normal; color: var(--signal); }
  .cv-tag { margin: 16px 0 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
</style>
<script src="../js/vendor/react.production.min.js"></script>
<script src="../js/vendor/react-dom.production.min.js"></script>
<script src="../js/astrohealth.js"></script>
</head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: signal 144x288 (3 x space-12) slab bleeding top/bottom/right; holo 176x128 (11 x space-4) bleeding top; line-strong tint 288x144 (6 x space-12) bleeding bottom; ink 48x48 (space-12) satellite.
      arrangement: one tall slab with satellites, all right of x=480, staggered so the tint and holo blocks overlap the slab edge.
      pattern: literal motif (orbit), four concentric orbital arcs at space-12 pitch around the slab corner, plus one radius-pill satellite, because the product is a body seen in orbit.
      steps and radii: space-4, space-12 multiples; radius-md tiles; radius-pill satellite.
    -->
    <defs><clipPath id="r"><rect x="496" y="0" width="464" height="288"/></clipPath></defs>
    <rect class="b-tint tile" x="528" y="160" width="288" height="144"/>
    <rect class="b-holo tile" x="640" y="-16" width="176" height="128"/>
    <rect class="b-signal tile" x="816" y="-16" width="160" height="320"/>
    <rect class="b-ink tile" x="560" y="64" width="48" height="48"/>
    <g clip-path="url(#r)">
      <circle class="orb" cx="816" cy="160" r="48"/>
      <circle class="orb" cx="816" cy="160" r="96"/>
      <circle class="orb-h" cx="816" cy="160" r="144"/>
      <circle class="orb" cx="816" cy="160" r="192"/>
      <circle class="sat" cx="714" cy="58" r="8"/>
    </g>
  </svg>
  <div class="cv-txt">
    <h1 class="cv-name">AstroHealth<i>.</i></h1>
    <p class="cv-tag">Crew health that never talks itself into reassuring you.</p>
  </div>
</div>
</body>
</html>
