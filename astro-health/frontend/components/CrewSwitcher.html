<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHealth · CrewSwitcher</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'night';</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/astrohealth.css">

<script src="../js/vendor/react.production.min.js"></script>
<script src="../js/vendor/react-dom.production.min.js"></script>
<script src="../js/astrohealth.js"></script>
</head>
<body>
<div id="root" class="vt-stage"></div>
<script>
  var V = window.AstroHealth, h = React.createElement;

  var crew = [
    { id: 'ao', name: 'A. Okafor', role: 'CDR', tier: 'GREEN' },
    { id: 'ml', name: 'M. Lindqvist', role: 'FE', tier: 'RED' },
    { id: 'rt', name: 'R. Tanaka', role: 'MS', tier: 'YELLOW' },
    { id: 'sr', name: 'S. Rahman', role: 'CMO', tier: 'GREY' }
  ];
  function Demo() { var s = React.useState('ml'); return h(V.CrewSwitcher, { crew: crew, value: s[0], onChange: s[1] }); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
