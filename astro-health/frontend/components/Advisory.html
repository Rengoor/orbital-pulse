<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHealth · Advisory</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'night';</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/astrohealth.css">

<script src="../js/vendor/react.production.min.js"></script>
<script src="../js/vendor/react-dom.production.min.js"></script>
<script src="../js/astrohealth.js"></script>
</head>
<body>
<div id="root" class="vt-stage"></div>
<script>
  var V = window.AstroHealth, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gap: 'var(--space-3)' } },
    h(V.Advisory, { stream: true, status: 'escalated', verdictNote: 'ALERT_CMO', model: 'onboard-7b',
      text: 'Heart rate has climbed steadily for 40 minutes while cabin CO2 rose. Pause EVA prep, sit for 10 minutes and drink 300 ml. If HR stays above 90, the CMO should take a manual BP.' }),
    h(V.Advisory, { status: 'blocked', verdictNote: 'cannot lower RED', text: 'Readings look within normal limits; no action needed.' })
  ));
</script>
</body>
</html>
