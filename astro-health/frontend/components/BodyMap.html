<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHealth · BodyMap</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'night';</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/astrohealth.css">

<script src="../js/vendor/react.production.min.js"></script>
<script src="../js/vendor/react-dom.production.min.js"></script>
<script src="../js/astrohealth.js"></script>
</head>
<body>
<div id="root" class="vt-stage"></div>
<script>
  var V = window.AstroHealth, h = React.createElement;
  var zones = [
    { id: 'neuro', tier: 'GREEN', value: '6.9', unit: 'h sleep', sub: 'mood 4/5' },
    { id: 'resp', tier: 'YELLOW', value: '3850', unit: 'ppm CO2', sub: 'cabin rising' },
    { id: 'cardio', tier: 'YELLOW', value: '96', unit: 'bpm', sub: 'BP 132/84' },
    { id: 'radiation', tier: 'GREEN', value: '0.42', unit: 'µSv/h', sub: 'RadLab' },
    { id: 'metabolic', tier: 'GREY', value: null, unit: 'mmol/L', sub: 'sensor fault' },
    { id: 'thermal', tier: 'GREEN', value: '36.8', unit: '°C', sub: '2 min ago' },
    { id: 'msk', tier: 'RED', value: '4', unit: 'min today', sub: 'target 150/wk' }
  ];
  function Demo() {
    var s = React.useState('cardio'), f = React.useState('suit');
    return h('div', { style: { display: 'grid', gap: 'var(--space-3)', justifyItems: 'start' } },
      h(V.SegmentedControl, { ariaLabel: 'Figure', value: f[0], onChange: f[1], options: [
        { value: 'suit', label: 'EVA suit', icon: 'helmet' }, { value: 'body', label: 'Body', icon: 'body' }] }),
      h(V.Panel, { title: 'Crew · M. Lindqvist', meta: 'MET 142:06:31', roomy: true, scan: true, style: { width: 560 } },
        h(V.BodyMap, { zones: zones, selected: s[0], onSelect: s[1], figure: f[0] })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
